name: CMake on multiple platforms

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # Use the matrix OS for the runner environment
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # We run the Linux jobs on ubuntu-22.04, but override the environment using the Debian container
        os: [ubuntu-22.04, macos-14, windows-2022]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-22.04
            c_compiler: clang
            setup_compiler: llvm
          - os: macos-14
            c_compiler: clang
            setup_compiler: llvm
          - os: windows-2022
            c_compiler: gcc
            setup_compiler: gcc

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Setup C/C++ Toolchain
        uses: aminya/setup-cpp@v1.8.0
        with:
          cache-tools: true
          compiler: ${{ matrix.setup_compiler }}
          cmake: true
          ninja: true

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
